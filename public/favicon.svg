<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="The Folly">
  <rect width="64" height="64" rx="14" fill="#15131f"/>
  <!-- Georgian arched doorway: original emblem, not derived from any artwork -->
  <path d="M20 50V30a12 12 0 0 1 24 0v20" fill="none" stroke="#c9a24b" stroke-width="3.2" stroke-linejoin="round"/>
  <line x1="16" y1="50" x2="48" y2="50" stroke="#c9a24b" stroke-width="3.2" stroke-linecap="round"/>
  <!-- a small lantern flame within the arch -->
  <path d="M32 24c2.6 2.4 4 4.7 4 7a4 4 0 0 1-8 0c0-1 .4-2 1.2-3.1C30.6 26.7 31.6 25.3 32 24Z" fill="#e8c873"/>
  <circle cx="32" cy="14" r="2.4" fill="#7c6fd4"/>
</svg>
